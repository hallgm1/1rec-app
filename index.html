<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional POS - P58E Service</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        /* Modern UI and Print Optimizations */
        body { background: #f4f7f6; margin: 0; padding: 10px; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .form-container { 
            background: #fff; padding: 20px; width: 100%; max-width: 400px; 
            margin-bottom: 20px; border-radius: 12px; box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; transition: 0.2s; }
        .btn-print { background: #2ecc71; grid-column: span 2; font-size: 16px; }
        .share-section { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; width: 100%; }
        .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-share { background: #3498db; }
        .btn-pdf { background: #e74c3c; }

        /* P58E Physical Dimensions (58mm) */
        #receipt-area { 
            width: 58mm; background: white; padding: 10mm 4mm 20mm 4mm; color: #000;
            font-family: 'Courier New', Courier, monospace; font-size: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .center { text-align: center; }
        .dashed { border-bottom: 1px dashed #000; margin: 10px 0; }

        @media print { 
            .form-container, .share-section { display: none !important; } 
            body { background: white; padding: 0; } 
            #receipt-area { box-shadow: none; width: 58mm; padding: 0; margin: 0; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h3 style="margin: 0 0 15px 0;">P58E Receipt Generator</h3>
    <input type="text" id="in-biz" placeholder="BUSINESS NAME" style="width:100%; padding:10px; margin-bottom:10px;">
    <input type="number" id="in-price" placeholder="AMOUNT (TZS)" style="width:100%; padding:10px;">
    
    <div class="btn-group">
        <button class="btn-print" onclick="window.print()">PRINT TO P58E</button>
    </div>

    <div class="share-section">
        <label style="font-size:12px; color:#666;">DIGITAL SHARING (NO WATERMARK)</label>
        <div class="share-grid">
            <button class="btn btn-share" onclick="shareAsImage()">SHARE JPG</button>
            <button class="btn btn-pdf" onclick="shareAsPDF()">SHARE PDF</button>
        </div>
    </div>
</div>

<div id="receipt-area">
    <div class="center" style="font-weight:bold; font-size:14px;" id="disp-biz">BUSINESS NAME</div>
    <div class="dashed"></div>
    <div style="display:flex; justify-content:space-between;">
        <span>TOTAL:</span><span id="disp-total">0.00</span>
    </div>
    <div class="dashed"></div>
    <div id="qrcode" style="display:flex; justify-content:center; margin:10px 0;"></div>
    <div class="center" style="font-size:10px;">THANK YOU FOR YOUR BUSINESS</div>
</div>

<script>
    // Digital Sharing Logic (Bypasses RawBT app entirely)
    async function shareAsImage() {
        const canvas = await html2canvas(document.querySelector("#receipt-area"));
        canvas.toBlob(async (blob) => {
            const file = new File([blob], "receipt.jpg", { type: "image/jpeg" });
            if (navigator.share) {
                await navigator.share({ files: [file], title: 'Receipt' });
            }
        });
    }

    async function shareAsPDF() {
        const canvas = await html2canvas(document.querySelector("#receipt-area"));
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'mm', format: [58, 150] });
        pdf.addImage(imgData, 'PNG', 0, 0, 58, 150);
        const pdfBlob = pdf.output('blob');
        const file = new File([pdfBlob], "receipt.pdf", { type: "application/pdf" });
        if (navigator.share) {
            await navigator.share({ files: [file], title: 'Receipt PDF' });
        }
    }

    document.getElementById('in-biz').oninput = (e) => document.getElementById('disp-biz').innerText = e.target.value.toUpperCase();
    document.getElementById('in-price').oninput = (e) => document.getElementById('disp-total').innerText = "Tsh " + e.target.value;
</script>

</body>
</html>
