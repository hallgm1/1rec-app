<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Agro POS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #232f3e; display: flex; justify-content: center; padding: 20px; }
        .form-container { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { border: none; color: white; padding: 15px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; margin-bottom: 10px; }
        .btn-print { background: #2ecc71; }
        .btn-reset { background: #95a5a6; }
        
        /* Receipt Printing Styles */
        #receipt-print { display: none; }
        @media print {
            body { background: white; padding: 0; }
            .form-container { display: none; }
            #receipt-print { 
                display: block; 
                width: 58mm; 
                font-family: 'Courier New', Courier, monospace; 
                font-size: 12px; 
                line-height: 1.2;
            }
            .dotted { border-top: 2px dotted #000; margin: 5px 0; }
            .center { text-align: center; }
            .bold { font-weight: bold; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <label>Customer Name</label>
    <input type="text" id="custName" value="WILLIAM MATHAYO GENDO">
    
    <label>Item Name</label>
    <input type="text" id="itemName" value="BRAKE BOOSTER">
    
    <label>Total Amount (TZS)</label>
    <input type="number" id="totalAmt" value="300000">

    <label>Receipt No.</label>
    <input type="text" id="rcptNo" value="36765">

    <button class="btn btn-print" onclick="doPrint()">PRINT RECEIPT</button>
    <button class="btn btn-reset" onclick="location.reload()">RESET FORM</button>
</div>

<div id="receipt-print">
    <div class="center bold">*** START OF LEGAL RECEIPT ***</div>
    <div class="center bold" style="font-size: 14px; margin-top: 5px;">METRO AGRO MACHINERY & SPARES LTD</div>
    <div class="center">P O BOX 79790 MOROGORO<br>TEL +255 783 290 717<br>MSAMVU, TANZANIA</div>
    <div class="center">TIN: 101840182 | VRN: 10016208N</div>
    <div class="dotted"></div>
    <div>CUSTOMER: <span id="p-cust"></span></div>
    <div>ID: 321459636</div>
    <div class="dotted"></div>
    <div style="display: flex; justify-content: space-between;">
        <span>RCPT NO:</span><span id="p-no"></span>
    </div>
    <div id="p-date"></div>
    <div class="dotted"></div>
    <div class="bold" style="display: flex; justify-content: space-between;">
        <span id="p-item"></span><span id="p-total"></span>
    </div>
    <div style="font-size: 10px;">EXCL TAX: 254,237 | VAT 18%: 45,763</div>
    <div class="dotted"></div>
    <div class="center bold" style="font-size: 24px; margin: 10px 0;" id="p-big-total"></div>
    <div class="dotted"></div>
    <div class="center">CODE: <span id="p-code"></span></div>
    <div id="qrcode" style="display: flex; justify-content: center; margin: 10px 0;"></div>
    <div class="center bold">*** END OF LEGAL RECEIPT ***</div>
</div>

<script>
function doPrint() {
    // Fill the receipt with form data
    const name = document.getElementById('custName').value;
    const item = document.getElementById('itemName').value;
    const total = document.getElementById('totalAmt').value;
    const no = document.getElementById('rcptNo').value;
    const now = new Date();

    document.getElementById('p-cust').innerText = name;
    document.getElementById('p-item').innerText = item;
    document.getElementById('p-total').innerText = Number(total).toLocaleString() + " E";
    document.getElementById('p-big-total').innerText = Number(total).toLocaleString();
    document.getElementById('p-no').innerText = no;
    document.getElementById('p-code').innerText = "479B" + no;
    document.getElementById('p-date').innerText = now.toLocaleDateString() + " " + now.toLocaleTimeString();

    // Clear and generate QR Code
    document.getElementById('qrcode').innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
        text: "479B" + no,
        width: 128,
        height: 128,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    // Wait a split second for QR to render, then print
    setTimeout(() => { window.print(); }, 300);
}
</script>

</body>
</html>
